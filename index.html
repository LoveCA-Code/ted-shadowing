<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shadowing">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Shadowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button type="button" class="talk" id="talkInfo" aria-label="점검 화면 열기">
    <b id="talkTitle">불러오는 중…</b><span id="talkSub"></span>
  </button>
  <button id="videoT" type="button" class="toggle" aria-pressed="false">Video</button>
  <button id="koT" type="button" class="toggle" aria-pressed="true">Translate</button>
</header>
<div class="video" id="videoBox" hidden>
  <video id="video" playsinline webkit-playsinline preload="none"></video>
</div>
<main class="list" id="list"></main>
<footer class="pad">
  <button type="button" class="side" id="prev" aria-label="이전 구간"><svg class="icon" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5.5v13L9 12z"/></svg></button>
  <button type="button" class="main" id="play" aria-label="현재 구간 처음부터 재생">
    <svg class="icon" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
    <span id="counter"></span><span class="time" id="clock"></span>
  </button>
  <button type="button" class="side" id="next" aria-label="다음 구간"><svg class="icon" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5.5v13L15 12z"/></svg></button>
</footer>
<audio id="audio" preload="none"></audio>

<div class="toast" id="toast" hidden></div>

<!-- 점검 화면 (개발 중 확인용: 이어폰 신호, 구간 끝 정지 오차). 제목을 누르면 열림 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <div class="sheet-head"><b>점검</b><button type="button" id="sheetClose" class="toggle">닫기</button></div>
    <p class="sheet-label">이어폰·잠금화면 신호 (최근 10개)</p>
    <ol id="signals" class="log"></ol>
    <p class="sheet-label">구간 끝 정지 오차 (늦게 멈춘 시간)</p>
    <p id="stopStats" class="stats"></p>
    <ol id="stops" class="log"></ol>
    <p class="sheet-label">재생 방식</p>
    <p id="engine" class="stats"></p>
  </div>
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
