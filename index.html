<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#18202a">
<meta name="color-scheme" content="dark">
<!-- 글꼴·스타일을 받기 전에도 흰 화면이 아니라 어두운 배경이 보이게 -->
<style>html, body { background: #0f141a; color: #e8edf2; }</style>
<meta name="apple-mobile-web-app-title" content="Shadowing">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Shadowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴은 화면 표시를 막지 않게 나중에 적용 (받기 전에는 기본 글꼴) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button type="button" class="talk" id="talkInfo" aria-label="강연 목록 열기"><b id="talkTitle">불러오는 중…</b><span id="talkSub"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <button id="unitBtn" type="button" class="toggle unit-btn" aria-label="구간 단위 바꾸기">문장</button>
  <button id="videoT" type="button" class="toggle" aria-pressed="false">Video</button>
  <button id="koT" type="button" class="toggle" aria-pressed="true">Translate</button>
</header>
<div class="video" id="videoBox" hidden>
  <video id="video" playsinline webkit-playsinline preload="none"></video>
</div>
<div class="stage">
  <main class="list" id="list"></main>
  <button id="speedBtn" type="button" class="speed" aria-label="재생 속도 바꾸기">1.0×</button>
</div>
<footer class="pad">
  <button type="button" class="side" id="prev" aria-label="이전 구간"><svg class="icon" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5.5v13L9 12z"/></svg></button>
  <button type="button" class="main" id="play" aria-label="현재 구간 처음부터 재생">
    <svg class="icon" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
    <span id="counter"></span><span class="time" id="clock"></span>
  </button>
  <button type="button" class="side" id="next" aria-label="다음 구간"><svg class="icon" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5.5v13L15 12z"/></svg></button>
</footer>
<audio id="audio" preload="none"></audio>

<div class="toast" id="toast" hidden></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <p class="sheet-label">구간 단위</p>
    <div class="units" id="units"></div>
    <div class="sheet-btns">
      <button id="bookBtn" type="button" class="book-btn">단어장 (0개)</button>
      <button id="flowBtn" type="button" class="book-btn flow-btn">발표 구조</button>
    </div>
    <div class="sheet-row">
      <div><b>영어 가리기</b><span>지금 구간의 영어를 막대로 가립니다. 누르면 보입니다.</span></div>
      <button id="hideT" type="button" class="toggle" aria-pressed="false">가리기</button>
    </div>
  </div>
</div>

<!-- F6 뜻 창 -->
<div class="sheet" id="wordSheet" hidden>
  <div class="sheet-body card" id="wordCard"></div>
</div>

<!-- F8 발표 구조 -->
<div class="book" id="flow" hidden>
  <div class="book-head"><b>발표 구조</b><button id="flowClose" type="button" class="toggle">닫기</button></div>
  <div class="flow-list" id="flowList"></div>
</div>

<!-- F7 강연 목록 -->
<div class="book" id="talks" hidden>
  <div class="book-head"><b>강연</b><button id="talksClose" type="button" class="toggle">닫기</button></div>
  <ul class="book-list talk-list" id="talkList"></ul>
</div>

<!-- F6 단어장 화면 -->
<div class="book" id="book" hidden>
  <div class="book-head"><b>단어장</b><button id="bookClose" type="button" class="toggle">닫기</button></div>
  <ul class="book-list" id="bookList"></ul>
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // 새 버전이 설치되면 한 번 새로고침해서 바로 새 화면을 보여 준다 (처음 설치 때는 제외)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js').then((reg) => {
    if (reg.waiting) reg.waiting.postMessage('skip');
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') w.postMessage('skip'); });
    });
  }).catch(() => {});
}
</script>
</body>
</html>
